name: Deploy preview to GitHub Pages

# This deploys a PREVIEW build to GitHub Pages at a /AvantSpecs/ sub-path —
# for reviewing changes only. The real production site (avantspecs.com) is
# hosted on GoDaddy and is NOT deployed by this workflow; it's uploaded
# manually from a separate `npm run build` (which uses base:'/' from
# vite.config.ts, correct for a domain-root deployment). This workflow
# overrides that with --base=/AvantSpecs/ so asset paths resolve correctly
# under GitHub Pages' project-page sub-path instead.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx vite build --base=/AvantSpecs/
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
