<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Decodes the redirect from public/404.html (GitHub Pages SPA
      // fallback — see that file). Must run before the app's router reads
      // location.pathname, so it's the very first thing in <head>. No-op
      // when the page loads normally (no ?p= param), including on the
      // GoDaddy/Apache deployment where .htaccess handles routing instead
      // and this param is never set.
      (function () {
        var params = new URLSearchParams(window.location.search);
        var redirect = params.get('p');
        if (redirect) {
          var url = new URL(redirect, window.location.origin);
          window.history.replaceState(null, '', url.pathname + url.search + url.hash);
        }
      })();
    </script>
    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%images/logo-192.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Botanical Export House India | AvantSpecs</title>
    <meta
      name="description"
      content="AvantSpecs is a botanical export house in India, a merchant export house sourcing, GC-MS testing, and shipping essential oils, oleoresins, spices, nuts, powders, and eco disposables to wholesale buyers worldwide. As a documented, COA-backed essential oil and spice exporter, every consignment ships fully documented to spec."
    />
    <link rel="canonical" href="https://avantspecs.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://avantspecs.com/" />
    <meta property="og:site_name" content="AvantSpecs" />
    <meta property="og:title" content="Botanical Export House India | AvantSpecs" />
    <meta
      property="og:description"
      content="A botanical export house and merchant export house in India, sourcing, GC-MS testing, and shipping essential oils, oleoresins, spices, nuts, powders, and eco disposables to wholesale buyers worldwide. Every consignment fully documented to spec."
    />
    <meta property="og:image" content="https://avantspecs.com/images/Shipping.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Botanical Export House India | AvantSpecs" />
    <meta
      name="twitter:description"
      content="A botanical export house and merchant export house in India, sourcing, GC-MS testing, and shipping essential oils, oleoresins, spices, nuts, powders, and eco disposables to wholesale buyers worldwide."
    />
    <meta name="twitter:image" content="https://avantspecs.com/images/Shipping.jpg" />

    <!--
      display=optional (not swap): with the async media=print/onload swap-in
      below, the stylesheet often finishes loading after first paint. With
      display=swap, that late arrival re-flows every element sized by this
      text — the SEO audit's Lighthouse run measured a 0.499 CLS on the
      product template from exactly this, attributed to the footer moving
      as the swap re-flowed everything above it. display=optional gives the
      webfont a short window to arrive before first paint and otherwise
      keeps the fallback for the rest of that pageview (no later swap, no
      shift) — the font is still fetched and cached for next visit.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Jost:wght@500;600;700&display=optional"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Jost:wght@500;600;700&display=optional"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Jost:wght@500;600;700&display=optional"
        rel="stylesheet"
      />
    </noscript>

    <!--
      Structured data is no longer hand-written here. src/lib/structuredData.ts
      generates JSON-LD from the same data (src/data/content.ts,
      ContactSection's address/contact fields) the UI renders from, and
      useStructuredData in src/lib/hooks.ts injects a script tag with it, one
      per route (Organization+WebSite on the homepage, one Product per
      product page). scripts/prerender.mjs runs each route through a real
      browser after `vite build` and bakes the resulting DOM into the static
      HTML, so that tag is still present without JS execution.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
